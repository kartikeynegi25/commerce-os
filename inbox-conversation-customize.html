<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Conversation | Commerce OS</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/custom.css">
    <script src="js/app.js"></script>
    <script src="js/inbox.js"></script>
</head>
<body class="text-stone-900">
    <div class="flex h-screen">
        <div id="mobileMenuBackdrop" onclick="openMenu()" class="fixed inset-0 bg-[#0f2b1c]/40 backdrop-blur-xs z-40 hidden md:hidden transition-opacity"></div>

        <aside id="sidebar" class="fixed top-0 left-0 bottom-0 z-50 w-64 h-screen flex flex-col text-stone-100 transition-transform duration-200 -translate-x-full md:translate-x-0">
            <div class="sidebar-header p-5 pb-4 flex items-center justify-between">
                <span class="font-heading text-2xl font-extrabold tracking-tight text-[#0f2b1c]">
                    Nexus
                </span>
                <button onclick="openMenu()" class="md:hidden text-emerald-200 hover:text-white p-1">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12" />
                    </svg>
                </button>
            </div>

            <nav class="flex-1 p-4 space-y-1.5 overflow-y-auto">
                <a href="dashboard.html" class="sidebar-link">Dashboard</a>
                <a href="inbox.html" class="sidebar-link active">Inbox</a>
                <a href="orders.html" class="sidebar-link">Orders</a>
                <a href="customers.html" class="sidebar-link">Customers</a>
                <a href="products.html" class="sidebar-link">Products</a>
                <a href="calls.html" class="sidebar-link">Calls</a>
                <a href="invoices.html" class="sidebar-link">Invoices</a>
                <a href="settings.html" class="sidebar-link">Settings</a>
            </nav>

            <div data-user-signedin onclick="alertPop('Signed in as Kartikey Negi')" class="sidebar-footer p-4 text-xs font-bold cursor-pointer flex items-center justify-between mt-auto">
                <div class="flex items-center gap-2">
                    <span class="w-2.5 h-2.5 rounded-full bg-lime-400 shadow-[0_0_6px_#A3E635]"></span>
                    <span>Kartikey (Owner)</span>
                </div>
                <span class="text-xs">🌱</span>
            </div>
        </aside>

        <main class="flex-1 overflow-y-auto md:ml-64 p-4 md:p-8">
            <button onclick="openMenu()" class="md:hidden mb-4 px-3 py-1.5 btn-forest text-xs rounded-md">
                ☰ MENU
            </button>
            
            <div class="flex items-center gap-3 mb-8">
                <a href="inbox.html" class="text-stone-400 hover:text-stone-900 transition text-xl">←</a>
                <div>
                    <h1 class="font-heading text-lg font-bold text-[#164028]">Sana Iyer</h1>
                    <p class="text-xs text-stone-500">Website · sana.iyer@example.com</p>
                </div>
            </div>

            <div id="chatBox" class="max-w-full md:max-w-2xl space-y-4">
                <div class="flex justify-start">
                    <div class="market-card rounded-tl-sm px-4 py-3 max-w-md">
                        <p class="text-sm">Can I get the set of bigger size, not what's listed?</p>
                    </div>
                </div>

                <div class="flex justify-end">
                    <div class="bg-amber-50/80 border border-amber-200 rounded-2xl rounded-tr-sm px-4 py-3 max-w-md">
                        <p class="text-sm text-stone-900">Let me check with the team on custom sizing for you.</p>
                        <p class="text-xs text-amber-800 font-bold mt-2">⚠ Escalated — custom requests need manual review</p>
                    </div>
                </div>
            </div>

            <div class="max-w-full md:max-w-2xl mt-4 flex gap-2">
                <input type="text"
                    id="replyInput"
                    onkeydown="if(event.key === 'Enter') sendReply()"
                    placeholder="Type a reply..."
                    class="flex-1 px-4 py-2 text-sm">
                <button onclick="sendReply()" class="btn-forest text-sm font-bold px-4 py-2 rounded-lg transition">Send</button>
            </div>
        </main>
    </div>

    <script>
        loadSavedReplies();
    </script>
</body>
</html>
